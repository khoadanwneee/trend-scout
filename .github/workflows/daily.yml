name: daily-scrape-and-digest

on:
  schedule:
    # 01:00 UTC = 08:00 Vietnam time (GitHub cron may start a few minutes late)
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write         # needed to commit data.json and the state DB

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Built-in token: no personal access token needed for public GitHub data.
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Scrape all sources
        run: python cli.py scrape

      - name: Send Telegram digest
        # A failed digest must not stop the dashboard data from being published.
        continue-on-error: true
        run: python cli.py digest

      - name: Export dashboard data
        run: python cli.py export

      - name: Commit data (triggers Vercel redeploy)
        working-directory: .
        run: |
          git config user.name "trend-scout-bot"
          git config user.email "trend-scout-bot@users.noreply.github.com"
          git add data/trend_scout.db frontend/public/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily data update"
            git push
          fi
